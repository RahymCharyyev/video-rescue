name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Что собирать
        type: choice
        default: all
        options: [all, mac-arm64, mac-x64, win-x64]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg nasm
      - run: bash scripts/build-untrunc.sh
      - run: npm ci
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - run: npm run typecheck
      - run: npm test

  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          all='[{"runner":"macos-15","target":"--mac --arm64","name":"mac-arm64"},{"runner":"macos-15-intel","target":"--mac --x64","name":"mac-x64"},{"runner":"windows-latest","target":"--win --x64","name":"win-x64"}]'
          if [ "$PLATFORM" = all ]; then m="$all"; else m=$(echo "$all" | jq -c --arg p "$PLATFORM" 'map(select(.name == $p))'); fi
          echo "matrix={\"include\":$m}" >> "$GITHUB_OUTPUT"

  package:
    needs: [test, plan]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - if: runner.os == 'macOS'
        run: brew install nasm
      - if: runner.os == 'macOS'
        run: bash scripts/build-untrunc.sh

      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git make diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-untrunc.sh

      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: video-rescue-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
